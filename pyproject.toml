[tool.coverage.run]
source = ["tests/lib"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise AssertionError",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    # E501 conflicts with the formatter on unbreakable assert strings
    # (policy literals). Formatter owns layout; lint owns correctness.
    "E501",
]
