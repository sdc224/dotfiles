name: Tests (unit + integration)

on:
  pull_request:
    paths:
      - "dot_config/**"
      - "dot_local/**"
      - "run_*.tmpl"
      - "Library/**"
      - ".chezmoi*"
      - "docs/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    # Hot path: zero dependencies, stdlib only. Fast correctness signal.
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests (stdlib only, no pip installs)
        run: python3 -m unittest discover -s tests/unit -v

  coverage:
    # Completeness signal: 100% line + branch on tests/lib/repo.py.
    # Separate job so `unit` stays fast and dependency-free.
    # Still blocking: a new helper without a test must fail the PR.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install coverage only
        run: python -m pip install coverage>=7
      - name: Coverage (tests/lib must stay 100%)
        run: |
          coverage run -m unittest discover -s tests/unit
          coverage report --fail-under=100 --show-missing

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install shellcheck, shfmt and ruff
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck shfmt
          python -m pip install -q "ruff>=0.4"
      - name: shellcheck shipped scripts
        run: shellcheck -S warning dot_local/bin/executable_dotfiles-sync dot_local/bin/executable_dotfiles-auto-update dot_local/bin/executable_dotfiles-doctor
      - name: shfmt formatting check (2-space indent, repo style)
        run: shfmt -i 2 --diff dot_local/bin/executable_dotfiles-sync dot_local/bin/executable_dotfiles-auto-update dot_local/bin/executable_dotfiles-doctor
      - name: ruff lint (Rust-based, fastest)
        run: ruff check tests/
      - name: ruff format check
        run: ruff format --check tests/
      # Template rendering (chezmoi execute-template / cat) is covered by
      # the integration jobs, which run the real templates per profile.

  integration-mac:
    runs-on: macos-15 # arm64, matches the work fleet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install chezmoi
        run: brew install chezmoi
      - name: Integration tests (work + personal profiles, stubbed brew)
        run: python3 -m unittest discover -s tests/integration -v

  integration-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install chezmoi
        run: bash tests/lib/install-chezmoi.sh "$HOME/.local/bin"
      - name: Integration tests (work + personal profiles, stubbed dnf/flatpak)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 -m unittest discover -s tests/integration -v

  integration-fedora:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install python + chezmoi
        run: |
          dnf install -y python3 curl tar gzip diffutils
          bash tests/lib/install-chezmoi.sh /usr/local/bin
      - name: Integration tests on real Fedora userland
        run: python3 -m unittest discover -s tests/integration -v
